  never published.
description: >-
  The Department of Justice publishes no plans and charges nothing. Every API in this record is a
  free public government service with no tiers, no metering, no billing surface and no paid
  upgrade path. This is the correct and expected shape for a U.S. federal executive department
  publishing public records under FOIA and the OPEN Government Data Act — the absence of a
  pricing page here is not a gap in the provider's programme.
