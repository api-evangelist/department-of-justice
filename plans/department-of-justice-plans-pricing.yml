access:
  model: free-public
  signup_required: partial
  detail: >-
    Four of the five surfaces need no account at all — the DOJ News API, the BJS NCVS and NIBRS
    datasets and the FARA e-File feed all answered anonymous requests with 200 on 2026-09-06. The
    National FOIA Portal is the exception: it requires a free api.data.gov key, obtained through a
    self-serve form at https://www.foia.gov/developer/#api-key-signup with no payment step and no
    approval queue.
  signup_url: https://www.foia.gov/developer/#api-key-signup
