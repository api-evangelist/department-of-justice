                          properties: {}
                      additionalProperties: false
                    uniqueItems: true
        '400':
          description: Syntax error
        '403':
          description: 'Forbidden: The api_key is missing'
        '404':
          description: Not Found
      operationId: getCfoMeetingByEntity
      x-operation-id-source: derived
