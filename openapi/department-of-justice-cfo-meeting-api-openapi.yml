        '200':
          description: successful operation
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data:
                    description: An array of objects each containing \"type\" and \"id\" members for to-many relationships.
                    type: array
                    items:
                      description: The "type" and "id" to non-empty members.
                      type: object
                      required:
                      - type
                      - id
                      properties:
                        type:
