    url: https://www.justice.gov/contact-us
- aid: department-of-justice:bjs-ncvs-api
  name: BJS National Crime Victimization Survey (NCVS) API
  description: >-
    The Bureau of Justice Statistics NCVS API provides REST access to the National Crime Victimization
    Survey datasets. Endpoints expose Personal Victimization, Personal Population, Household Victimization,
    and Household Population data in JSON and CSV. The API uses a path, resource, and query parameter
    structure with a default page size of 1,000 records.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://bjs.ojp.gov/national-crime-victimization-survey-ncvs-api
  baseURL: https://api.ojp.gov/bjsdataset/v1
  tags:
  - BJS
  - Crime
  - NCVS
  - Statistics
  - Victimization
  properties:
  - type: Documentation
    url: https://bjs.ojp.gov/national-crime-victimization-survey-ncvs-api
  - type: X-NCVSProgram
    url: https://bjs.ojp.gov/data-collection/ncvs
  - type: X-Featured
