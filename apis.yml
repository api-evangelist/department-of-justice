- aid: department-of-justice:fara-efile-api
  name: FARA e-File Registrant API
  description: >-
    The Foreign Agents Registration Act e-File system exposes registrant data filed under FARA as JSON.
    The DOJ Developer Resources page describes the FARA.gov API as providing public access to registrations,
    short-form filings for individual foreign agents, and foreign principals. Only the registrant feeds
    were reachable when probed on 2026-09-06: /api/v1/Registrants/json/Active and /api/v1/Registrants/json/Terminated
    both returned 200 without a key, while the ORDS API landing page linked from the DOJ developer page
    returned 500. There is no published reference documentation for these endpoints.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.justice.gov/developer
  baseURL: https://efile.fara.gov/api/v1
  tags:
  - FARA
  - Foreign Agents
  - National Security Division
  - Registrants
  properties:
  - type: Documentation
    url: https://www.justice.gov/developer
  - type: X-FARAProgram
    url: https://www.justice.gov/nsd-fara
  - type: X-BrowseFilings
    url: https://efile.fara.gov/ords/fara/f?p=1381:1
  contact:
  - FN: DOJ National Security Division, FARA Unit
    url: https://www.justice.gov/nsd-fara
