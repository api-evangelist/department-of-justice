  contact:
  - FN: Bureau of Justice Statistics
    url: https://bjs.ojp.gov/about-bjs-website
- aid: department-of-justice:bjs-nibrs-api
  name: BJS NIBRS National Estimates API
  description: >-
    The Bureau of Justice Statistics NIBRS National Estimates API provides REST access to the National
    Incident-Based Reporting System estimates including victimization counts and rates. Endpoints return
    JSON or CSV and follow a path, resource, query parameter structure with a default page size of 1,000
    records.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: >-
    https://bjs.ojp.gov/national-incident-based-reporting-system-nibrs-national-estimates-api
  baseURL: https://api.ojp.gov/bjsdataset/v1
  tags:
