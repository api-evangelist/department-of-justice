apis:
- aid: department-of-justice:doj-news-api
  name: DOJ News API
  description: >-
    The DOJ News API exposes press releases and blog entries from the Office of Public Affairs as a JSON
    web service. The api_v1 reference documents four resources — list and detail views for press_releases
    and blog_entries — with field selection, zero-based paging (default 20, maximum 50), sorting, and
    bracketed filter parameters such as parameters[title] and parameters[date] in Unix epoch seconds.
    The DOJ Developer Resources page also describes speeches, but no speeches resource is listed in the
    reference and GET /api/v1/speeches.json returned 404 when probed on 2026-09-06.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.justice.gov/developer/api-documentation/api_v1
  baseURL: https://www.justice.gov/api/v1
  tags:
  - Blog
  - News
  - Office of Public Affairs
  - Press Releases
  - Speeches
  properties:
  - type: Documentation
    url: https://www.justice.gov/developer/api-documentation/api_v1
  - type: DeveloperPortal
    url: https://www.justice.gov/developer
  - type: X-OpenGovernment
    url: https://www.justice.gov/open/developer-resources
  - type: X-GitHubClient
    url: https://github.com/rOpenGov/usdoj
  contact:
