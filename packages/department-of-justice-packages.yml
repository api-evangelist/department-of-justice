description: >-
  Client libraries for the Department of Justice API surface. The Department publishes no
  first-party SDK in any package registry — the DOJ Developer Resources page, the justice.gov
  api_v1 documentation, the FOIA.gov developer page and the BJS NCVS/NIBRS API pages all
  document raw HTTP calls only. The single actively maintained client is the community R
  package `usdoj`, published on CRAN by rOpenGov, which wraps the DOJ News API.
